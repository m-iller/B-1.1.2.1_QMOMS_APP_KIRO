[project]
name = "quarry-mining-monitor-simulator"
version = "0.1.0"
description = "Telemetry simulation script for Quarry Mining Monitor"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
